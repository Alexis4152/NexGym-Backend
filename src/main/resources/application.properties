spring.application.name=NexoraSport

# ---- Base de datos ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/nexorasport}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.properties.hibernate.format_sql=false

# ---- JWT ----
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-in-production-please-0123456789}
app.jwt.access-token-expiration-minutes=${APP_JWT_ACCESS_MIN:30}
app.jwt.refresh-token-expiration-hours=${APP_JWT_REFRESH_HOURS:8}
app.jwt.refresh-cookie-name=nexorasport_refresh_token
app.jwt.refresh-cookie-secure=${APP_COOKIE_SECURE:false}
app.jwt.refresh-cookie-samesite=${APP_COOKIE_SAMESITE:Lax}

# ---- CORS ----
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5174}

# ---- Archivos ----
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# ---- Correo (SMTP) ----
# La cuenta SMTP vive en la tabla mail_config y la edita el SUPER_ADMIN desde
# "Correo del sistema" (/api/admin/mail-config), igual que en DemoPV. Estas variables
# APP_MAIL_* solo se usan UNA vez, como valores iniciales al sembrar mail_config en el
# primer arranque (MailConfigDataInitializer); despues ya no se leen y se pueden quitar.
spring.mail.host=${APP_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${APP_MAIL_PORT:587}
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Cifrado de credenciales guardadas en BD (hoy: contrasena SMTP de mail_config) ----
# En produccion el valor real vive SOLO en la variable APP_ENCRYPTION_KEY de Coolify. Si
# cambia, la contrasena SMTP ya guardada deja de poder descifrarse: hay que volver a
# capturarla en "Correo del sistema".
app.encryption.key=${APP_ENCRYPTION_KEY:solo-para-desarrollo-local-nunca-usar-en-produccion}

# ---- QZ Tray (impresion de tickets en impresora termica) ----
# En Coolify los archivos viven en el volumen /app/qz-keys (rutas fijadas en el Dockerfile).
# PENDIENTE (opcional): aceptar el par en base64 por variable o guardarlo en BD, como
# DemoPV (APP_QZ_CERTIFICATE_BASE64 / APP_QZ_PRIVATE_KEY_BASE64), para no subir archivos a mano.
app.qz.certificate-path=${APP_QZ_CERT_PATH:qz-keys/digital-certificate.txt}
app.qz.private-key-path=${APP_QZ_KEY_PATH:qz-keys/private-key.pem}

# ---- Frontend ----
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5174}

# ---- Semilla inicial ----
app.seed.super-admin-email=${APP_SEED_ADMIN_EMAIL:admin@nexorasport.com}
app.seed.super-admin-password=${APP_SEED_ADMIN_PASSWORD:CambiaEsta123}

server.port=${PORT:8081}
server.forward-headers-strategy=framework
